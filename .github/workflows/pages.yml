# Публикация приложения на GitHub Pages.
#
# Сборка повторяется здесь, а не берётся из репозитория: так опубликованный
# app.js всегда соответствует исходникам в src/, даже если кто-то забыл
# выполнить npm run build перед коммитом. На Pages уходит только само
# приложение — без src/, server/, tests/ и инструментов.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Проверка потерянных импортов
        run: npm run check
      - name: Собрать то, что уходит на хостинг
        run: |
          mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest sw.js dist/
          cp -r icons dist/icons
          cp -r anim dist/anim
          # 404 возвращает приложение: ссылка вида /kamron-app/#routine должна открываться
          cp index.html dist/404.html
      - name: В сборке есть всё, на что ссылается страница
        run: node tools/dist-check.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
