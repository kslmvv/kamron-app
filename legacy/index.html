<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kamron APP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Kamron APP: планы, проекты, университет, Jarvis, заметки и игры." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Kamron APP — мой день</title>
  </head>
  <body data-theme="sky">
    <div class="app-shell" id="app">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
      <nav class="bottom-nav" id="nav" aria-label="Основная навигация"></nav>
    </div>
    <dialog class="sheet" id="modal" aria-label="Редактирование"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <p
        style="
          padding: 24px;
          font:
            17px/1.5 -apple-system,
            system-ui,
            sans-serif;
        "
      >
        Kamron APP работает на JavaScript. Включите его в настройках браузера и обновите страницу.
      </p>
    </noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
