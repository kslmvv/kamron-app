<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kamron APP">
  <!--
    Вариант под маску. Система обрезает иконку под свою форму — круг,
    скруглённый квадрат, каплю, — поэтому буква сжата к середине и целиком
    помещается в безопасную зону в 80% ширины.
  -->
  <rect width="512" height="512" fill="#000"/>
  <g stroke="#fff" stroke-width="37" stroke-linecap="round" fill="none">
    <path d="M190 165 L190 347"/>
    <path d="M212 258 L334 168"/>
    <path d="M212 254 L334 344"/>
  </g>
</svg>
