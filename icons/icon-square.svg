<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kamron APP">
  <!--
    Логотип: буква К на чёрном. Без обводок, бликов и градиентов — на
    домашнем экране иконка видна размером с ноготь, и выживает в ней
    только силуэт. Диагонали нарисованы линиями с круглыми концами, а не
    многоугольниками: так стык со стойкой выходит без зазубрины.
  -->
  <rect width="512" height="512" fill="#000"/>
  <g stroke="#fff" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M173 142 L173 370"/>
    <path d="M200 258 L352 146"/>
    <path d="M200 254 L352 366"/>
  </g>
</svg>
