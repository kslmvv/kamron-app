# Описание проекта для XcodeGen. Файл .xcodeproj руками не пишется и в
# репозиторий не кладётся: он генерируется из этого описания одной командой,
# а значит не ломается при слиянии и не тянет за собой чужие локальные пути.
name: KamronAPP
options:
  bundleIdPrefix: com.kslmvv
  deploymentTarget:
    # 17.0 — из-за кнопок в виджете и живом уведомлении: нажатие внутри
    # виджета появилось только в этой версии. Ниже виджет соберётся, но
    # кнопка «Сделал» станет просто картинкой.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Команду подписи Xcode подставит сам при первом запуске на устройстве.
    CODE_SIGN_STYLE: Automatic

# Схемы задаём явно.
#
# XcodeGen пересобирает .xcodeproj с нуля, и схемы, которые Xcode завёл
# сам, при этом пропадают. В селекторе остаётся «No Scheme», а ⌘R молча
# ничего не делает — выглядит как «сборка не идёт».
#
# Запускать нужно схему приложения: она ставит на телефон и его, и
# расширение с виджетами. Схема расширения запускает только виджет.
schemes:
  KamronAPP:
    build:
      targets:
        KamronAPP: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  KamronAPP:
    type: application
    platform: iOS
    sources:
      # Info.plist исключён из ресурсов: иначе Xcode получает два задания
      # на один и тот же файл и сборка падает на конфликте.
      - path: KamronAPP
        excludes:
          - Info.plist
          - AppSecrets.example.swift
      - path: Shared
        excludes:
          - Secrets.example.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kslmvv.kamronapp
        # PRODUCT_NAME без пробела: от него зависит имя исполняемого файла.
        # Красивое имя под иконкой задаёт CFBundleDisplayName в Info.plist.
        PRODUCT_NAME: KamronAPP
        INFOPLIST_FILE: KamronAPP/Info.plist
        # Info.plist свой, поэтому генератор Xcode выключен: иначе он
        # перезапишет файл и потеряет заданные в нём ключи.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Общего ящика здесь нет нарочно: с бесплатной учётной записью
        # Apple не подписывает App Group, и сборка падает ещё до запуска.
        # Виджет в этом случае берёт день с сервера. Есть платная учётная
        # запись — собирайте из project.appgroup.yml, там ящик включён.
    dependencies:
      # Расширение кладётся внутрь приложения — иначе виджета не будет
      # в списке на устройстве.
      - target: KamronWidgetsExtension
        embed: true

  KamronWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KamronWidgets
        excludes:
          - Info.plist
      # Модель дня, хранилище и питомец общие с приложением: два отдельных
      # описания одного и того же разъезжаются при первой же правке.
      - path: Shared
        excludes:
          - Secrets.example.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kslmvv.kamronapp.widgets
        PRODUCT_NAME: KamronWidgets
        INFOPLIST_FILE: KamronWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
